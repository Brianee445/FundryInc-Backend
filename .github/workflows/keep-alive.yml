name: Keep Render Server Alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render
        run: |
          curl -L -fsS --max-time 20 "${{ secrets.RENDER_URL }}/ping" \
            && echo "Ping succeeded" \
            || { echo "Ping failed"; exit 1; }

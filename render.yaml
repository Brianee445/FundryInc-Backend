services:
  - type: web
    name: fundry-api
    runtime: python
    repo: https://github.com/FundryInc/backend
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_FOUNDER_BASIC_MONTHLY_PLAN_CODE
        sync: false
      - key: PAYSTACK_FOUNDER_BASIC_ANNUAL_PLAN_CODE
        sync: false
      - key: PAYSTACK_FOUNDER_PREMIUM_MONTHLY_PLAN_CODE
        sync: false
      - key: PAYSTACK_FOUNDER_PREMIUM_ANNUAL_PLAN_CODE
        sync: false
      - key: PAYSTACK_INVESTOR_BASIC_MONTHLY_PLAN_CODE
        sync: false
      - key: PAYSTACK_INVESTOR_BASIC_ANNUAL_PLAN_CODE
        sync: false
      - key: PAYSTACK_INVESTOR_PREMIUM_MONTHLY_PLAN_CODE
        sync: false
      - key: PAYSTACK_INVESTOR_PREMIUM_ANNUAL_PLAN_CODE
        sync: false
      - key: FRONTEND_BILLING_RETURN_URL
        sync: false
      - key: FRONTEND_BILLING_CANCEL_URL
        sync: false
